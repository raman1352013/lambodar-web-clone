<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lambodra Clone - New Rounded Floating Navbar Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">

  <!-- Simulated page background with hero -->
  <div class="h-[400px] bg-gradient-to-br from-orange-50 to-amber-100"></div>

  <!-- FLOATING ROUNDED NAVBAR (matches new Navbar.tsx styling) -->
  <header class="fixed top-0 left-0 right-0 z-50 px-3 sm:px-4 pt-3">
    <nav class="mx-auto max-w-7xl bg-white/95 backdrop-blur-md shadow-md border border-slate-100 py-3 rounded-2xl">
      <div class="px-4 flex items-center justify-between">
        <!-- Logo -->
        <div class="flex items-center gap-2">
          <div class="h-10 w-10 rounded-xl bg-[#fe6b00] text-white flex items-center justify-center font-black">L</div>
          <span class="font-extrabold text-lg text-slate-900">Lambodra Group</span>
        </div>

        <!-- Desktop Links -->
        <div class="hidden lg:flex items-center gap-6">
          <a href="#" class="text-base font-semibold text-[#fe7d05]">Home</a>
          <a href="#" class="text-base font-medium text-slate-900 hover:text-[#fe7d05] flex items-center gap-1">Products <span>▾</span></a>
          <a href="#" class="text-base font-medium text-slate-900 hover:text-[#fe7d05]">Brand</a>
          <a href="#" class="text-base font-medium text-slate-900 hover:text-[#fe7d05]">About Us</a>
          <a href="#" class="text-base font-medium text-slate-900 hover:text-[#fe7d05]">Internship</a>
          <a href="#" class="text-base font-medium text-slate-900 hover:text-[#fe7d05]">Contact Us</a>
          <button class="text-base font-medium text-slate-900 hover:text-[#fe7d05] flex items-center gap-1">Login <span>▾</span></button>
        </div>

        <!-- Mobile hamburger -->
        <div class="lg:hidden space-y-1.5 w-6">
          <span class="block h-0.5 bg-slate-700"></span>
          <span class="block h-0.5 bg-slate-700"></span>
          <span class="block h-0.5 bg-slate-700"></span>
        </div>
      </div>
    </nav>
  </header>

  <div class="p-8 text-center text-slate-500">
    <p class="font-semibold">This is a static preview of the NEW rounded floating navbar.</p>
    <p>Run <code class="bg-slate-200 px-2 rounded">npm run dev</code> in the repo to see the live React version.</p>
  </div>

</body>
</html>
